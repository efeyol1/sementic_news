# Germany country configuration — first non-TR pilot.
#
# This starts intentionally small: enough source coverage to exercise the
# country-aware pipeline without making Germany quality depend on a large,
# unvalidated feed registry. Phase 7 should expand and audit source coverage.

country_code: DE
country_name: Germany
country_slug: germany
language: de
timezone: Europe/Berlin

sentiment:
  enabled: true
  zero_shot_model: joeddav/xlm-roberta-large-xnli
  # Keep unset for Germany until a German/multilingual fine-tuned classifier
  # is selected. The Turkish fine-tuned model should not be used for DE.
  finetuned_model: null
  labels: [positive, negative, neutral]
  candidate_labels:
    positive: "positive Nachricht"
    negative: "negative Nachricht"
    neutral:  "neutrale Nachricht"

ner:
  # The legacy ``src.analysis.ner`` module hard-codes the Turkish NER model
  # and writes into ``news_items.entities``. Leave it off for Germany — the
  # new multilingual entity track below replaces it for non-TR countries.
  enabled: false
  model: null
  keep_labels: [PER, ORG, LOC]

entity_narrative:
  # Sprint 1 of the entity-centric narrative track. Writes one row per
  # detected mention into ``entity_mentions``. Wikidata linking arrives in
  # Sprint 2; collocations in Sprint 5.
  enabled: true
  ner_model: Davlan/bert-base-multilingual-cased-ner-hrl
  keep_labels: [PER, ORG, LOC, MISC]
  aliases:
    people:
      Recep Tayyip Erdoğan:
        wikidata_qid: Q39259
        aliases:
          - erdoğan
          - recep tayyip erdoğan
          - cumhurbaşkanı erdoğan
          - präsident erdoğan
      Donald Trump:
        wikidata_qid: Q22686
        aliases:
          - trump
          - donald trump
          - präsident trump
      Angela Merkel:
        wikidata_qid: Q567
        aliases:
          - merkel
          - angela merkel
          - kanzlerin merkel
    organizations: {}
  wikidata:
    enabled: false
    min_confidence: 0.85

clustering:
  enabled: true
  method: kmeans
  default_n_clusters: 15
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  stopwords:
    - der
    - die
    - das
    - den
    - dem
    - des
    - ein
    - eine
    - einer
    - eines
    - einem
    - und
    - oder
    - aber
    - mit
    - für
    - von
    - in
    - im
    - am
    - an
    - auf
    - aus
    - als
    - zu
    - zum
    - zur
    - ist
    - sind
    - war
    - waren
    - wird
    - werden
    - hat
    - haben
    - hatte
    - hatten
    - nach
    - bei
    - über
    - unter
    - gegen
    - vor
    - seit
    - so
    - wie
    - auch
    - nicht
    - noch
    - nur
    - schon
    - wieder
    - sich
    - er
    - sie
    - es
    - wir
    - ihr
    - dass
    - wenn
    - weil
    - mehr
    - neue
    - neuer
    - neues
    - neuen
    - aktuell
    - deutschland
    - deutsche
    - deutschen
    - deutschlands
    - jahr
    - jahre
    - jahren
    - euro
    - prozent
    - heute

embeddings:
  enabled: true
  model: paraphrase-multilingual-MiniLM-L12-v2
  vector_dim: 384

discovery:
  report_dir: data/discovery
  default_min_expected_items: 10
  category_strategy: infer_from_url

