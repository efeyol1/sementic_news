# Italy country configuration — Sprint 3 of the entity-narrative track.
#
# Third non-TR country (after Germany Sprint 1 and France Sprint 2).
# Purpose: broaden the cross-country corpus to a third language and a
# third political-narrative landscape, exercising the multilingual NER +
# Wikidata linker on Italian text.
#
# Source URLs below were live-validated on 2026-05-23 (HTTP 200 +
# ``feedparser`` bozo=False + non-empty entries). Feeds that failed are
# kept in the registry with ``enabled: false`` and a dated comment, per
# germany.yaml / france.yaml precedent — no silent removal.

country_code: IT
country_name: Italy
country_slug: italy
language: it
timezone: Europe/Rome

sentiment:
  enabled: true
  # No Italian/multilingual fine-tuned classifier selected yet — stay on
  # multilingual zero-shot. The Turkish fine-tuned model must not be
  # used here (src/pipeline.py:80 raises if ``finetuned_model`` is set
  # without a real IT-trained checkpoint).
  zero_shot_model: joeddav/xlm-roberta-large-xnli
  finetuned_model: null
  labels: [positive, negative, neutral]
  candidate_labels:
    positive: "notizia positiva"
    negative: "notizia negativa"
    neutral:  "notizia neutra"

ner:
  # Legacy ``src.analysis.ner`` is Turkish-hardcoded; off for IT. The
  # multilingual entity_narrative track below replaces it for non-TR.
  enabled: false
  model: null
  keep_labels: [PER, ORG, LOC]

entity_narrative:
  # Sprint 1 scaffolding + Sprint 2 Wikidata linking, now applied to a
  # third language. Writes one row per mention into ``entity_mentions``;
  # the resolver back-fills ``wikidata_qid`` / ``canonical`` so shared
  # entities (Trump, Erdoğan, Merkel, Macron) share a single QID across
  # the TR / DE / FR / IT corpora.
  enabled: true
  ner_model: Davlan/bert-base-multilingual-cased-ner-hrl
  keep_labels: [PER, ORG, LOC, MISC]
  aliases:
    people:
      # ---- Cross-country anchor entities (MUST match other configs) ----
      Donald Trump:
        wikidata_qid: Q22686
        aliases:
          - trump
          - donald trump
          - presidente trump
      Recep Tayyip Erdoğan:
        wikidata_qid: Q39259
        aliases:
          - erdoğan
          - erdogan
          - recep tayyip erdoğan
          - presidente erdogan
      Emmanuel Macron:
        wikidata_qid: Q3052772
        aliases:
          - macron
          - emmanuel macron
          - presidente macron
      Angela Merkel:
        wikidata_qid: Q567
        aliases:
          - merkel
          - angela merkel
          - cancelliera merkel
      # ---- IT-specific political figures ----
      Giorgia Meloni:
        wikidata_qid: Q1605002
        aliases:
          - meloni
          - giorgia meloni
          - presidente meloni
          - premier meloni
      Sergio Mattarella:
        wikidata_qid: Q261241
        aliases:
          - mattarella
          - sergio mattarella
          - presidente mattarella
      Matteo Salvini:
        wikidata_qid: Q1158127
        aliases:
          - salvini
          - matteo salvini
      Silvio Berlusconi:
        wikidata_qid: Q11860
        aliases:
          - berlusconi
          - silvio berlusconi
    organizations: {}
  wikidata:
    # Sprint 2: linking ON so the cross-country acceptance target
    # (≥60% qid fill on FR + DE + IT) is measurable. Fail-soft on API
    # errors so collection never blocks on a Wikidata outage.
    enabled: true
    # 0.65 calibrated against Sprint 3 IT live run (2026-05-23): the first
    # IT pipeline tour landed at 53.7 % qid_fill at 0.70 — niche Italian
    # entities (Federal Reserve banca centrale, Palazzo Montecitorio
    # palazzo storico, lago Lemano) were legit Wikidata hits with partial
    # label matches scoring 0.55–0.60. Dropping 5 points captures them
    # while ambiguous single-token mentions (Marina, Rafael) still reject.
    min_confidence: 0.65
  collocations:
    # Sprint 5: ±10 token windows lemmatized via spaCy it_core_news_sm.
    enabled: true
    window: 10
    respect_sentence_boundary: true
    keep_pos: [NOUN, PROPN, VERB, ADJ]
    min_lemma_length: 3
    min_cooccurrence_count: 2
    lemmatizer: spacy
    spacy_model: it_core_news_sm
    stopwords_file: configs/stopwords/it.yaml
  frame_bridge:
    # Sprint 10: collocate lemmas → 6-frame intensity via configs/frames/it.yaml.
    enabled: true
  rag:
    # Sprint 11: grounded explanation layer for cross-country framing Q&A.
    # Uses Claude when ANTHROPIC_API_KEY is present; otherwise extractive fallback.
    enabled: true
    model: claude-sonnet-4-6

clustering:
  enabled: true
  method: kmeans
  default_n_clusters: 15
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  # Italian TF-IDF stopwords; mirrors the German / French depth so
  # cluster keywords aren't dominated by function words or IT-news noise.
  stopwords:
    # Articoli
    - il
    - lo
    - la
    - i
    - gli
    - le
    - un
    - una
    - uno
    - dell
    - della
    - dello
    - delle
    - degli
    - dei
    - del
    # Preposizioni
    - di
    - a
    - da
    - in
    - su
    - per
    - con
    - tra
    - fra
    - al
    - allo
    - alla
    - ai
    - agli
    - alle
    - dal
    - dallo
    - dalla
    - dai
    - dagli
    - dalle
    - nel
    - nello
    - nella
    - nei
    - negli
    - nelle
    - sul
    - sullo
    - sulla
    - sui
    - sugli
    - sulle
    # Congiunzioni
    - e
    - ed
    - o
    - od
    - ma
    - però
    - anche
    - se
    - quando
    - perché
    - come
    - mentre
    - quindi
    - infatti
    # Pronomi
    - io
    - tu
    - lui
    - lei
    - noi
    - voi
    - loro
    - si
    - ci
    - ne
    - mi
    - ti
    - vi
    # Verbi comuni
    - è
    - sono
    - ho
    - ha
    - hai
    - hanno
    - abbiamo
    - avete
    - era
    - erano
    - sarà
    - saranno
    - fa
    - fanno
    - essere
    - avere
    - fare
    # IT-news noise
    - italia
    - italiano
    - italiana
    - italiani
    - italiane
    - anno
    - anni
    - euro
    - oggi
    - ieri
    - domani
    - milioni
    - miliardi
    - mese
    - mesi
    - giorno
    - giorni
    - ora
    - ore
    - dopo
    - prima
    - ancora
    - già
    - solo
    - molto
    - più
    - meno
    - contro
    - secondo
    - durante
    - non
    - che
    - cui
    - dove
    - chi

embeddings:
  enabled: true
  model: paraphrase-multilingual-MiniLM-L12-v2
  vector_dim: 384

discovery:
  report_dir: data/discovery
  default_min_expected_items: 10
  category_strategy: infer_from_url

