# France country configuration — Sprint 2 of the entity-narrative track.
#
# Second non-TR country. Purpose: produce the first real cross-country
# entity output (DE + FR, TR still excluded until Sprint 4) and exercise
# the Wikidata linker on two languages at once.
#
# Source URLs below are seeded from each outlet's published RSS endpoints
# but MUST be live-validated on first run (see germany.yaml for the
# pattern: feeds returning 404 / malformed XML get ``enabled: false``
# with a dated comment rather than silent removal).

country_code: FR
country_name: France
country_slug: france
language: fr
timezone: Europe/Paris

sentiment:
  enabled: true
  # No French/multilingual fine-tuned classifier selected yet — stay on
  # multilingual zero-shot. The Turkish fine-tuned model must not be used.
  zero_shot_model: joeddav/xlm-roberta-large-xnli
  finetuned_model: null
  labels: [positive, negative, neutral]
  candidate_labels:
    positive: "nouvelle positive"
    negative: "nouvelle négative"
    neutral:  "nouvelle neutre"

ner:
  # Legacy ``src.analysis.ner`` is Turkish-hardcoded; off for FR. The
  # multilingual entity_narrative track below replaces it for non-TR.
  enabled: false
  model: null
  keep_labels: [PER, ORG, LOC]

entity_narrative:
  # Sprint 1 scaffolding + Sprint 2 Wikidata linking. Writes one row per
  # mention into ``entity_mentions``; the resolver back-fills
  # ``wikidata_qid`` / ``canonical`` so "Trump" links to Q22686 in both
  # FR and DE corpora (cross-language identity).
  enabled: true
  ner_model: Davlan/bert-base-multilingual-cased-ner-hrl
  keep_labels: [PER, ORG, LOC, MISC]
  aliases:
    people:
      Emmanuel Macron:
        wikidata_qid: Q3052772
        aliases:
          - macron
          - emmanuel macron
          - président macron
      Marine Le Pen:
        wikidata_qid: Q3052248
        aliases:
          - le pen
          - marine le pen
      Donald Trump:
        wikidata_qid: Q22686
        aliases:
          - trump
          - donald trump
          - président trump
      Vladimir Poutine:
        wikidata_qid: Q7747
        aliases:
          - poutine
          - vladimir poutine
          - président poutine
      Recep Tayyip Erdoğan:
        # Cross-country anchor: same QID as turkey.yaml / germany.yaml so
        # Sprint 2 acceptance ("Trump/Erdoğan same Q-ID everywhere") holds.
        wikidata_qid: Q39259
        aliases:
          - erdogan
          - erdoğan
          - recep tayyip erdogan
          - président erdogan
      Ursula von der Leyen:
        wikidata_qid: Q1685244
        aliases:
          - von der leyen
          - ursula von der leyen
    organizations:
      Union européenne:
        wikidata_qid: Q458
        aliases:
          - ue
          - union européenne
          - l'union européenne
      OTAN:
        wikidata_qid: Q7184
        aliases:
          - otan
          - l'otan
  wikidata:
    # Sprint 2: linking ON for the cross-country acceptance target
    # (≥60% qid fill on FR+DE). Unresolved mentions stay fail-soft.
    enabled: true
    # 0.70 calibrated against Sprint 2 multilingual scoring (2026-05-20):
    # exact label match (0.55) + Wikidata id (0.05) + multilingual type
    # keyword bonus (0.15) = 0.75 for an unambiguous FR hit like Macron.
    # Bumping back to 0.85 would re-introduce the false-negative regime
    # observed on the first FR/DE live runs.
    min_confidence: 0.70

clustering:
  enabled: true
  method: kmeans
  default_n_clusters: 15
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  # French TF-IDF stopwords; mirrors the German list's depth so cluster
  # keywords aren't dominated by function words.
  stopwords:
