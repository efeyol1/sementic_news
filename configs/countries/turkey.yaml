# Turkey country configuration — V1 pilot.
#
# Schema is shared across all countries. Section semantics:
#   country_*       - identity / locale (always required)
#   sentiment.*     - sentiment analysis backend selection per country
#   ner.*           - named entity recognition; disable for languages
#                     where we don't have a quality fine-tuned model
#   clustering.*    - topic clustering parameters incl. stopwords
#   embeddings.*    - vector embedding model (multilingual works for most)
#   sources         - RSS feeds; multiple URLs per source supported
#
# In V2 Phase 2 the loader (src/config/country_loader.py) only consumes
# the `sources` section and the country identity fields. Other sections
# describe the pipeline behavior for downstream phases (3+) but are
# declared now so the YAML schema stays stable across the rollout.

country_code: TR
country_name: Turkey
country_slug: turkey
language: tr
timezone: Europe/Istanbul

sentiment:
  enabled: true
  # Default: zero-shot xlm-roberta when SENTIMENT_MODEL_ID env not set.
  zero_shot_model: joeddav/xlm-roberta-large-xnli
  # Fine-tuned BERT (used by daily pipeline + ONNX int8 path).
  finetuned_model: efeyol11/bert-turkish-sentiment
  # Canonical label set the pipeline persists into the DB.
  labels: [positive, negative, neutral]
  # Multilingual zero-shot candidate labels per language; only the
  # current country's language is consumed during inference.
  candidate_labels:
    positive: "olumlu haber"
    negative: "olumsuz haber"
    neutral:  "tarafsız haber"

ner:
  enabled: true
  model: savasy/bert-base-turkish-ner-cased
  # Subset of HuggingFace NER tags we keep; everything else dropped.
  keep_labels: [PER, ORG, LOC]

entity_narrative:
  # Sprint 4 activation (2026-05-25): entity-narrative track ON.
  # TR's legacy `ner` path stays enabled in parallel (news_items.entities
  # column for the existing top-entities dashboard); the new entity_narrative
  # populates entity_mentions table. Both DB paths run; legacy ner stays
  # untouched until Sprint 6+ when it can be retired.
  enabled: true
  ner_model: Davlan/bert-base-multilingual-cased-ner-hrl
  keep_labels: [PER, ORG, LOC, MISC]
  aliases:
    people:
      Recep Tayyip Erdoğan:
        wikidata_qid: Q39259
        aliases:
          - erdoğan
          - recep tayyip erdoğan
          - cumhurbaşkanı erdoğan
      Donald Trump:
        wikidata_qid: Q22686
        aliases:
          - trump
          - donald trump
      Angela Merkel:
        wikidata_qid: Q567
        aliases:
          - merkel
          - angela merkel
      Ekrem İmamoğlu:
        wikidata_qid: Q19818562
        aliases:
          - imamoğlu
          - ekrem imamoğlu
          - ibb başkanı imamoğlu
      Kemal Kılıçdaroğlu:
        wikidata_qid: Q3196140
        aliases:
          - kılıçdaroğlu
          - kemal kılıçdaroğlu
          - chp lideri
      Mansur Yavaş:
        wikidata_qid: Q60849148
        aliases:
          - mansur yavaş
          - ankara büyükşehir başkanı
      Devlet Bahçeli:
        wikidata_qid: Q707015
        aliases:
          - bahçeli
          - devlet bahçeli
          - mhp lideri
      Meral Akşener:
        wikidata_qid: Q15727088
        aliases:
          - akşener
          - meral akşener
      Ali Babacan:
        wikidata_qid: Q336518
        aliases:
          - babacan
          - ali babacan
      Ahmet Davutoğlu:
        wikidata_qid: Q386723
        aliases:
          - davutoğlu
          - ahmet davutoğlu
    # TR alias org coverage is Sprint 5+ work.
    organizations: {}
  wikidata:
    # Sprint 4: wikidata linking ON for TR. Uses the same throttled
    # resolver fixed in Sprint 2 (1.1s rate limit + 429 backoff +
    # multilingual _TYPE_KEYWORDS).
    enabled: true
    # 0.65 matches IT/ES Sprint 3 calibration. TR is multilingual NER
    # (Davlan) + Wikidata uselang=tr. Partial-label and disambig stems
    # behave similarly to the IT/ES corpus, so 0.65 is the right band.
    min_confidence: 0.65
  collocations:
    # Sprint 5 keeps TR collocations OFF: the surface-form fallback
    # (no spaCy TR model) collapses inflected variants only partially,
    # so PMI's top-K would be noisy. Sprint 6 flips this to true after
    # evaluating zeyrek as the TR morphology backend; until then the
    # TurkishSurfaceLemmatizer is exercised only by unit tests.
    enabled: false
    window: 10
    respect_sentence_boundary: true
    keep_pos: []  # surface-form lemmatizer emits POS='X', so no filter
    min_lemma_length: 3
    min_cooccurrence_count: 2
    lemmatizer: surface
    stopwords_file: configs/stopwords/tr.yaml

clustering:
  enabled: true
  method: kmeans
  default_n_clusters: 15
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  # TF-IDF stopword list; Turkish-specific. Other countries supply their
  # own list, or leave empty for sklearn's English defaults.
  stopwords:
    - bir
    - bu
    - ve
    - ile
    - için
    - de
    - da
