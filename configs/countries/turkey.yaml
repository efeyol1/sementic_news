embeddings:
  enabled: true
  model: paraphrase-multilingual-MiniLM-L12-v2
  vector_dim: 384

discovery:
  report_dir: data/discovery
  default_min_expected_items: 10
  category_strategy: infer_from_url

# RSS feed registry. Multi-feed sources (NTV, Milliyet) aggregate via
# in-memory link dedupe — same source_name in DB, multiple fetch URLs.
# Audit notes:
#   - NTV has 5 category feeds (each cap'd at ~20) → ~80 unique items
#     after dedupe.
#   - Milliyet's dunyarss.xml gives 50 items vs 20 from sondakika.
#   - Yeni Şafak RSS hard-cap'd at 15 items; category feeds 301 + empty XML.
#     SITEMAP path 200 URL veriyor (https://www.yenisafak.com/sitemap?...)
#     ama sadece URL + lastmod, title/summary için article HTML scrape
#     gerekecek → ayrı sitemap type handler işi (Phase 2 scope dışı, ileride).
#   - CNN Türk her kategori 35-item alias değil, gerçekten farklı içerik
#     veriyor → 11 kategori birleştirip dedupe = ~350 unique item.
#   - CNN Türk + Yeni Şafak occasionally serve future-dated entries
#     (publisher embargo / scheduled posts) — clip downstream if needed.
sources:
  - name: Habertürk
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # Ana feed 100 + 10 kategori (her biri ~30 item, %25-100 yeni içerik
    # baseline'a göre) → ~385 unique item.
    urls:
      - "https://www.haberturk.com/rss"
      - "https://www.haberturk.com/rss/gundem.xml"
      - "https://www.haberturk.com/rss/ekonomi.xml"
      - "https://www.haberturk.com/rss/spor.xml"
      - "https://www.haberturk.com/rss/dunya.xml"
      - "https://www.haberturk.com/rss/yasam.xml"
      - "https://www.haberturk.com/rss/saglik.xml"
      - "https://www.haberturk.com/rss/teknoloji.xml"
      - "https://www.haberturk.com/rss/magazin.xml"
      - "https://www.haberturk.com/rss/kultur-sanat.xml"
      - "https://www.haberturk.com/rss/otomobil.xml"

  - name: Habertürk
    type: googlenews_sitemap
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: general_discovery
    min_expected_items: 100
    # Bonus: Habertürk'ün Google News sitemap'i ~599 article + title
    # taşıyor. RSS multi-feed ile beraber DB'de ON CONFLICT(link) ile
    # birleşip toplam ~600+ unique item'a çıkıyor (RSS'in kapsamadığı
    # daha eski ya da niche article'lar dahil).
    urls:
      - "https://www.haberturk.com/sitemap_google_news.xml"

  - name: Hürriyet
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # Anasayfa 75 + 8 kategori (her biri 50-100 item) → ~680 unique.
    # En büyük kazanım kaynağı: 9× artış. saglik/kelebek/sondakika/oto
    # path'leri 0 item döndüğü için listelenmedi.
    urls:
      - "https://www.hurriyet.com.tr/rss/anasayfa"
      - "https://www.hurriyet.com.tr/rss/gundem"
      - "https://www.hurriyet.com.tr/rss/ekonomi"
      - "https://www.hurriyet.com.tr/rss/spor"
      - "https://www.hurriyet.com.tr/rss/dunya"
      - "https://www.hurriyet.com.tr/rss/yasam"
      - "https://www.hurriyet.com.tr/rss/teknoloji"
      - "https://www.hurriyet.com.tr/rss/magazin"
      - "https://www.hurriyet.com.tr/rss/seyahat"

  - name: NTV
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # Her kategori 20 item cap'inde, dedupe sonrası ~177 unique.
    urls:
      - "https://www.ntv.com.tr/gundem.rss"
      - "https://www.ntv.com.tr/son-dakika.rss"
      - "https://www.ntv.com.tr/turkiye.rss"
      - "https://www.ntv.com.tr/dunya.rss"
      - "https://www.ntv.com.tr/ekonomi.rss"
      - "https://www.ntv.com.tr/saglik.rss"
      - "https://www.ntv.com.tr/teknoloji.rss"
      - "https://www.ntv.com.tr/yasam.rss"
      - "https://www.ntv.com.tr/otomobil.rss"

  - name: CNN Türk
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # 11 kategori feed birleşip dedupe ile ~350 unique item.
    # Tek feed cap'i 35'te kilitli, ama her kategori farklı içerik veriyor.
    urls:
      - "https://www.cnnturk.com/feed/rss/news"
      - "https://www.cnnturk.com/feed/rss/turkiye/news"
      - "https://www.cnnturk.com/feed/rss/dunya/news"
      - "https://www.cnnturk.com/feed/rss/ekonomi/news"
      - "https://www.cnnturk.com/feed/rss/spor/news"
      - "https://www.cnnturk.com/feed/rss/saglik/news"
      - "https://www.cnnturk.com/feed/rss/teknoloji/news"
      - "https://www.cnnturk.com/feed/rss/yasam/news"
      - "https://www.cnnturk.com/feed/rss/kultur-sanat/news"
      - "https://www.cnnturk.com/feed/rss/magazin/news"
      - "https://www.cnnturk.com/feed/rss/otomobil/news"

  - name: Sözcü
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: general_discovery
    min_expected_items: 20
    # Sözcü'nün tüm kategori RSS feed'leri aynı 50 item'ı alias gibi
    # serve ediyor; multi-feed merge faydasız. RSS sadece güvenlik
    # ağı olarak (sitemap fail ederse).
    urls:
      - "https://www.sozcu.com.tr/rss/son-dakika.xml"

  - name: Sözcü
    type: googlenews_sitemap
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: general_discovery
    min_expected_items: 100
    # Asıl kazanç: Google News sitemap ~536 article + title + tarih
    # taşıyor. RSS ile birleşip dedupe sonrası ~536 unique item
    # (RSS'in 50'si büyük ihtimalle subset). 6× artış.
    urls:
      - "https://www.sozcu.com.tr/feeds/sitemapgooglenews"

  - name: Milliyet
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # 8 kategori birleşip dedupe → ~335 unique. dunya/yasam/teknoloji/
    # magazin/otomobil/yazarlar her biri 50 item ve %100 farklı içerik.
    urls:
      - "https://www.milliyet.com.tr/rss/rssnew/sondakikarss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/dunyarss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/ekonomirss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/yasamrss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/teknolojirss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/magazinrss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/otomobilrss.xml"
      - "https://www.milliyet.com.tr/rss/rssnew/yazarlarrss.xml"

  - name: Sabah
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 10
    # 13 kategori feed birleşip dedupe → ~148 unique item.
    # sondakika.xml en geniş (50), kalanlar 10-23 item arası, hepsi
    # birbiriyle örtüşmeden farklı içerik veriyor (3× kazanım).
    urls:
      - "https://www.sabah.com.tr/rss/sondakika.xml"
      - "https://www.sabah.com.tr/rss/anasayfa.xml"
      - "https://www.sabah.com.tr/rss/gundem.xml"
      - "https://www.sabah.com.tr/rss/ekonomi.xml"
      - "https://www.sabah.com.tr/rss/spor.xml"
      - "https://www.sabah.com.tr/rss/dunya.xml"
      - "https://www.sabah.com.tr/rss/yasam.xml"
      - "https://www.sabah.com.tr/rss/saglik.xml"
      - "https://www.sabah.com.tr/rss/magazin.xml"
      - "https://www.sabah.com.tr/rss/kultur-sanat.xml"
      - "https://www.sabah.com.tr/rss/egitim.xml"
      - "https://www.sabah.com.tr/rss/yazarlar.xml"
      - "https://www.sabah.com.tr/rss/finans.xml"

  - name: TRT Haber
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # sondakika.rss + manset.rss birleşip ~92 unique. Diğer kategori
    # path'leri (ekonomi, spor, dunya...) 0 item döndü, eklemedik.
    urls:
      - "https://www.trthaber.com/sondakika.rss"
      - "https://www.trthaber.com/manset.rss"

  - name: Cumhuriyet
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: auto
    min_expected_items: 20
    # Ana feed 100 + 8 kategori (her biri 100 item, çoğu %85-100 yeni
    # içerik) → ~860 unique. /rss/gundem 301 ile ana feed'e redirect
    # ediyor (aynı içerik), eklemedik.
    urls:
      - "https://www.cumhuriyet.com.tr/rss"
      - "https://www.cumhuriyet.com.tr/rss/ekonomi"
      - "https://www.cumhuriyet.com.tr/rss/spor"
      - "https://www.cumhuriyet.com.tr/rss/dunya"
      - "https://www.cumhuriyet.com.tr/rss/yasam"
      - "https://www.cumhuriyet.com.tr/rss/saglik"
      - "https://www.cumhuriyet.com.tr/rss/bilim-teknoloji"
      - "https://www.cumhuriyet.com.tr/rss/kultur-sanat"
      - "https://www.cumhuriyet.com.tr/rss/yazarlar"

  - name: Yeni Şafak
    type: rss
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: general_discovery
    min_expected_items: 10
    # RSS hard-cap'lı (15 item, kategori feed'leri 301 ile boş).
    # Sitemap-based scrape ile ~200 article'a çıkıyor (aşağıdaki entry).
    # RSS yine de güvenlik ağı: sitemap fail ederse en azından 15 item.
    urls:
      - "https://www.yenisafak.com/rss"

  - name: Yeni Şafak
    type: html_sitemap
    enabled: true
    category: general
    category_strategy: infer_from_url
    discovery_role: general_discovery
    min_expected_items: 100
    # Plain sitemap (no news:title). Her URL için article HTML'inden
    # <title> + og:description çekiliyor, ThreadPool ile 15 paralel
    # fetch. ~200 article ~10s'de scrape oluyor.
    urls:
      - "https://www.yenisafak.com/sitemap?contenttypes=news&contenttypes=official-announcement&name=standart&take=200"
