# Frame lexicon (French) — Sprint 10 frame bridge. See en.yaml for the
# contract. Lemmas matched case-insensitively against fr_core_news_sm output.
# Nationality adjectives intentionally excluded.
frames:
  economic:
    [économie, inflation, budget, impôt, commerce, marché, croissance,
     dette, investissement, prix, récession, chômage, salaire, déficit,
     monnaie, exportation, importation, fiscal, finance, coût, profit,
     perte, intérêt, bourse, action, subvention, tarif, recette, faillite]
  security:
    [sécurité, menace, terreur, terrorisme, attentat, police,
     criminalité, défense, frontière, militaire, arme, renseignement,
     surveillance, extrémisme, protection, arrestation, otage, enlèvement,
     espionnage, contrebande, enquête]
  identity:
    [identité, culture, religion, valeur, nation, national, tradition,
     patrimoine, ethnique, foi, laïque, langue, communauté,
     appartenance, patriotisme, souveraineté, laïcité, citoyen, étranger,
     immigré, intégration, minorité, peuple, nationalisme]
  governance:
    [gouvernement, politique, loi, réforme, réglementation, parlement,
