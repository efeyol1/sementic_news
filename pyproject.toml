[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-news"
version = "0.1.0"
description = "Multi-country European media intelligence pipeline — sentiment, NER, framing signals from 6-country news corpus"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Efe Yolartıran", email = "efeyol11@gmail.com"}]
readme = "README.md"

# Base = what the deployed FastAPI service needs to serve precomputed
# results from Postgres. The ML stack (torch/transformers/sentence-
# transformers) is intentionally NOT here: it would pull ~400MB into the
# API at import time and blow past Render's 512MB free tier. All inference
# happens in the daily pipeline (GitHub Actions) under the `pipeline`
# extra; the API only reads what the pipeline already wrote to the DB.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Daily pipeline: RSS collection, preprocessing, NER/sentiment/embedding
# inference, clustering, drift. Owns the heavy ML stack so the API base
# install stays light.
pipeline = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
    "scikit-learn>=1.4.0",
    "mlflow>=2.12.0",
    # Sprint 5: per-language tokenization + lemmatization + POS for
    # collocation extraction. Language models are NOT declared here —
    # they're downloaded explicitly with `python -m spacy download
    # <model>` in the CI / Render build step (each ~12-15 MB).
    "spacy>=3.7.0",
]
# Weekly retrain extras (extends pipeline).
training = [
    "accelerate>=1.1.0",
    "datasets>=2.19.0",
]
# ONNX export + dynamic int8 quantization for the sentiment model.
# Install only on the box doing the export or benchmark; the daily
# pipeline doesn't need this.
serving = [
    "optimum[onnxruntime]>=1.20.0",
]
# Sprint 11: Claude-backed RAG explainability generator. Optional — the
# extractive fallback runs with zero extra deps, so the API base install
# stays torch-free and the SDK is only needed where generation is enabled.
rag = [
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "behavioral: Behavioral / CheckList tests against the production sentiment model. Loads a real HF model (~440MB), slower than unit tests. Included by default — `pytest tests/` runs unit + behavioral together. Use `-m 'not behavioral'` to skip locally, or `-m behavioral` to run only the suite.",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
