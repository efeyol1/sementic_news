[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-news"
version = "0.1.0"
description = "Turkish News Sentiment Analysis Service"
requires-python = ">=3.10"

dependencies = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.12.0",
    "dvc>=3.50.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "sentence-transformers>=3.0.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]