[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-news"
version = "0.1.0"
description = "Turkish News Sentiment Analysis Service"
requires-python = ">=3.10"

# Base = what every entry point needs at runtime: the FastAPI service,
# the daily pipeline, retraining, and tests. Anything heavier (DVC,
# MLflow, datasets) lives in an extra so the deployed API image stays
# small.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Daily pipeline: RSS collection, preprocessing, clustering, drift.
pipeline = [
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
    "scikit-learn>=1.4.0",
    "mlflow>=2.12.0",
]
# Weekly retrain extras (extends pipeline).
training = [
    "accelerate>=1.1.0",
    "datasets>=2.19.0",
    "dvc>=3.50.0",
]
# ONNX export + dynamic int8 quantization for the sentiment model.
# Install only on the box doing the export or benchmark; the daily
# pipeline doesn't need this.
serving = [
    "optimum[onnxruntime]>=1.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "behavioral: Behavioral / CheckList tests against the production sentiment model. Loads a real HF model (~440MB), slower than unit tests. Included by default — `pytest tests/` runs unit + behavioral together. Use `-m 'not behavioral'` to skip locally, or `-m behavioral` to run only the suite.",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
