stages:
  collect:
    cmd: python -m src.data.rss_collector
    outs:
      - data/raw:
          cache: true
          persist: true   # her gün yeni dosya eklenir, DVC silmesin

  preprocess:
    cmd: python -m src.data.preprocessor
    deps:
      - data/raw
      - src/data/preprocessor.py
    outs:
      - data/processed:
          cache: true
          persist: true

  analyze:
    # sentiment → ner → clustering sırayla çalışır, hepsi data/analyzed'ı zenginleştirir
    cmd: >-
      python -m src.analysis.sentiment &&
      python -m src.analysis.ner &&
      python -m src.analysis.clustering
    deps:
      - data/processed
      - src/analysis/sentiment.py
      - src/analysis/ner.py
      - src/analysis/clustering.py
    outs:
      - data/analyzed:
          cache: true
          persist: true
