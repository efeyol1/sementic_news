name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []   # CI ile paralel — gerekirse `needs: [lint-and-test]` yap

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        # Render'da "Deploy Hook URL" oluştur → Settings → Deploy Hook
        # URL'yi GitHub secret olarak ekle: RENDER_DEPLOY_HOOK_URL
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            || echo "::warning::Render deploy hook failed (secret eksik olabilir)"
