name: Deploy

# Triggered by a successful CI run on main — avoids re-running ruff+pytest
# (the CI workflow is the gate). The Postgres service that used to live
# here was unused: tests mock the DB layer.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            || echo "::warning::Render deploy hook failed (secret eksik olabilir)"
