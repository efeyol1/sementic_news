name: Daily Pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # Her gün 04:00 UTC (Türkiye 07:00)
  workflow_dispatch:        # Manuel tetikleme için

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Initialise database schema
        run: python -m src.db.schema

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Drift check (sentiment distribution PSI)
        # Fail-soft: drift instrumentation never blocks the daily run.
        # Writes data/drift_reports/<date>.json and appends a summary
        # to $GITHUB_STEP_SUMMARY when the baseline has ≥ 7 qualifying days.
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python -m src.monitoring.drift
