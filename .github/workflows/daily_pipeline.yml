name: Daily Pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # Her gün 04:00 UTC (Türkiye 07:00)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Leave empty for today. When set, RSS collect is skipped (incident recovery mode)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # serving extra adds optimum[onnxruntime] for ONNX int8 sentiment
        # inference — the path that cuts the daily sentiment step from
        # ~16 min (PyTorch xlm-roberta) to ~4 min.
        run: pip install -e ".[pipeline,serving,dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Initialise database schema
        run: python -m src.db.schema

      - name: Export ONNX int8 sentiment model
        # Re-derives models/onnx_int8/ from the latest fine-tuned model on
        # HF Hub. ~1 min when the source weights are cache-warm; the daily
        # sentiment step then loads this artifact instead of running PyTorch.
        run: python -m src.serving.onnx_export

      - name: Run pipeline (Turkey)
        # SENTIMENT_BACKEND=onnx_int8 routes _load_pipeline() in
        # src/analysis/sentiment.py to the quantized ORT model. Drift
        # instrumentation runs as the final pipeline step (fail-soft).
        # When `date` workflow input is set, run in incident-recovery
        # mode: skip RSS collect (historical content unavailable) and
        # rebuild downstream artifacts for that specific date.
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          SENTIMENT_MODEL_ID: efeyol11/bert-turkish-sentiment
          SENTIMENT_BACKEND: onnx_int8
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m src.pipeline --country turkey --date "${{ inputs.date }}" --skip-collect
          else
            python -m src.pipeline --country turkey
          fi

      - name: Run pipeline (Germany)
        # Germany uses zero-shot xlm-roberta sentiment — no fine-tuned
        # model. SENTIMENT_MODEL_ID / SENTIMENT_BACKEND are deliberately
        # NOT set: _validate_sentiment_backend() in src/pipeline.py
        # raises if those env vars leak into a country whose config has
        # finetuned_model: null. continue-on-error so a DE failure does
        # not mask the TR run, which has already completed by this point.
        continue-on-error: true
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m src.pipeline --country germany --date "${{ inputs.date }}" --skip-collect
          else
            python -m src.pipeline --country germany
          fi
