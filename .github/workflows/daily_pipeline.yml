name: Daily Pipeline

on:
  schedule:
    - cron: "0 4 * * *"    # Her gün 04:00 UTC (Türkiye 07:00)
    - cron: "0 16 * * *"   # Her gün 16:00 UTC (Türkiye 19:00)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Leave empty for today. When set, RSS collect is skipped (incident recovery mode)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare-db:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[pipeline,dev]"

      - name: Initialise database schema
        run: python -m src.db.schema

  run-pipeline:
    runs-on: ubuntu-latest
    needs: prepare-db
    continue-on-error: ${{ matrix.optional }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - country: turkey
            optional: false
            spacy_model: ""
            sentiment_model_id: efeyol11/bert-turkish-sentiment
            sentiment_backend: onnx_int8
          - country: germany
            optional: true
            spacy_model: de_core_news_sm
            sentiment_model_id: ""
            sentiment_backend: ""
          - country: italy
            optional: true
            spacy_model: it_core_news_sm
            sentiment_model_id: ""
            sentiment_backend: ""
          - country: spain
            optional: true
            spacy_model: es_core_news_sm
            sentiment_model_id: ""
            sentiment_backend: ""
          - country: uk
            optional: true
            spacy_model: en_core_web_sm
            sentiment_model_id: ""
            sentiment_backend: ""
          - country: france
            optional: true
            spacy_model: fr_core_news_sm
            sentiment_model_id: ""
            sentiment_backend: ""

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # serving extra adds optimum[onnxruntime] for ONNX int8 sentiment
        # inference — the path that cuts the daily sentiment step from
        # ~16 min (PyTorch xlm-roberta) to ~4 min.
        run: pip install -e ".[pipeline,serving,dev]"

      - name: Download spaCy language model
        if: ${{ matrix.spacy_model != '' }}
        # Sprint 5: collocation extraction needs a per-language spaCy
        # ``sm`` model for EN/DE/FR/IT/ES. TR uses the surface-form
        # lemmatizer, so it does not need a spaCy model.
        run: python -m spacy download "${{ matrix.spacy_model }}"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Export ONNX int8 sentiment model
        if: ${{ matrix.country == 'turkey' }}
        # Re-derives models/onnx_int8/ from the latest fine-tuned model on
        # HF Hub. ~1 min when the source weights are cache-warm; the daily
        # sentiment step then loads this artifact instead of running PyTorch.
        run: python -m src.serving.onnx_export

      - name: Run pipeline (${{ matrix.country }})
        # TR uses the ONNX int8 fine-tuned sentiment path. Other countries
        # deliberately receive empty SENTIMENT_* env values and stay on their
        # YAML-declared zero-shot models; src/pipeline.py fails fast if the
        # Turkish fine-tuned backend leaks into a non-TR country.
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          SENTIMENT_MODEL_ID: ${{ matrix.sentiment_model_id }}
          SENTIMENT_BACKEND: ${{ matrix.sentiment_backend }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m src.pipeline --country "${{ matrix.country }}" --date "${{ inputs.date }}" --skip-collect
          else
            python -m src.pipeline --country "${{ matrix.country }}"
          fi
