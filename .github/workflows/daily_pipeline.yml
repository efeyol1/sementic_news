name: Daily Pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # Her gün 04:00 UTC (Türkiye 07:00)
  workflow_dispatch:        # Manuel tetikleme için

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # serving extra adds optimum[onnxruntime] for ONNX int8 sentiment
        # inference — the path that cuts the daily sentiment step from
        # ~16 min (PyTorch xlm-roberta) to ~4 min.
        run: pip install -e ".[pipeline,serving,dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Initialise database schema
        run: python -m src.db.schema

      - name: Export ONNX int8 sentiment model
        # Re-derives models/onnx_int8/ from the latest fine-tuned model on
        # HF Hub. ~1 min when the source weights are cache-warm; the daily
        # sentiment step then loads this artifact instead of running PyTorch.
        run: python -m src.serving.onnx_export

      - name: Run pipeline
        # SENTIMENT_BACKEND=onnx_int8 routes _load_pipeline() in
        # src/analysis/sentiment.py to the quantized ORT model. Drift
        # instrumentation runs as the final pipeline step (fail-soft).
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          SENTIMENT_MODEL_ID: efeyol11/bert-turkish-sentiment
          SENTIMENT_BACKEND: onnx_int8
        run: python -m src.pipeline
